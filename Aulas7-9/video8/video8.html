<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>O que é uma DIV?</title>
    <style>
        h1 {
            background-color: lightcoral;
            width: 300px;
        }
        p {
            background-color: lightseagreen;
            width: 300px;
        }
        h2{
            background-color: lightsteelblue;
        }
        h3{
            background-color: rgb(151, 151, 36);
        }
        div{
            width: 250px;
        }
    </style>
</head>
<body>
    <h1>O que é uma DIV?</h1>
    <p>Valéria Mazok</p>
    <hr>

    <div>
        <h2>Mazok</h2>
        <h3>Mazok Cruz</h3>
    </div>


</body>
</html>
